<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Portal Insiden & RTP - PT Dizamatra Powerindo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        :root { --bg:#f6f7f9; --card:#fff; --tx:#1b2430; --mu:#667085; --bd:#e3e6eb; --pr:#c2410c; --ok:#16a34a; --wa:#d97706; --er:#dc2626; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
        body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.5 system-ui,sans-serif; }
        header { background:var(--card); border-bottom:1px solid var(--bd); padding:10px 16px; position:sticky; top:0; z-index:5; }
        h1 { font-size:16px; margin:0; }
        h1 small { color:var(--mu); font-weight:400; display:block; font-size:12px; }
        nav { display:flex; gap:6px; margin-top:8px; overflow-x:auto; }
        button, .btn { font:inherit; border:1px solid var(--bd); background:var(--card); color:var(--tx); padding:6px 12px; border-radius:8px; cursor:pointer; }
        button.on, button.pri { background:var(--pr); color:#fff; border-color:var(--pr); }
        main { padding:16px; max-width:1200px; margin:auto; }
        .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:14px; margin-bottom:14px; }
        .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
        .kpis { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-bottom:14px; }
        .kpi b { font-size:24px; display:block; }
        .kpi span, .mu { color:var(--mu); font-size:12px; }
        h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; color:var(--mu); }
        .cv { position:relative; height:240px; }
        table { width:100%; border-collapse:collapse; }
        th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--bd); }
        tr.cl { cursor:pointer; } tr.cl:hover { background:var(--bg); }
        input, select, textarea { font:inherit; width:100%; padding:7px 9px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--tx); }
        label { display:block; font-size:12px; color:var(--mu); margin-bottom:2px; }
        .f { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
        .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; border:1px solid var(--bd); }
        .Open { color:var(--er); } .Progress { color:var(--wa); } .Done { color:var(--ok); }
        .bar { height:8px; background:var(--bd); border-radius:9px; overflow:hidden; }
        .bar i { display:block; height:100%; background:var(--ok); }
        .ev { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
        .ev img { height:70px; border-radius:6px; cursor:pointer; border:1px solid var(--bd); }
        .chip { padding:4px 8px; border:1px solid var(--bd); border-radius:8px; font-size:12px; color:var(--tx); text-decoration:none; }
        .rc { display:grid; gap:4px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
        .rc label { display:flex; gap:6px; align-items:center; color:var(--tx); font-size:13px; }
        .rc input { width:auto; }
        .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
        .row > * { width:auto; }
        #lb { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:9; }
        #lb img { max-width:92%; max-height:92%; }
        body.ro .ctl { display:none; }
        #st { position:fixed; right:12px; bottom:12px; background:var(--card); border:1px solid var(--bd); padding:6px 12px; border-radius:8px; display:none; z-index:8; }
        #st.bad { border-color:var(--er); color:var(--er); cursor:pointer; }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <header>
        <h1>Portal Insiden & RTP <small>PT. Dizamatra Powerindo</small></h1>
        <nav id="nav"></nav>
    </header>
    <main id="app"></main>
    <div id="st" onclick="flush()"></div>
    <div id="lb" onclick="this.style.display='none'"><img id="lbi"></div>

<script>
const OPEN_ACCESS = true;
const API_URL = "https://script.google.com/macros/s/AKfycbzGzLNBM9Vp8AABYMtpvY9TT8MTAJZokrCmA7KUeNCkrAXPbOoqqTp4_oV024HMhE9E/exec";
const CLIENT_ID = "GANTI_DENGAN_CLIENT_ID.apps.googleusercontent.com";

const RC = [["Pelaksanaan Prosedur/Kebijakan","UA"],["Penggunaan Peralatan","UA"],["Metode Perlindungan (APD)","UA"],["Tidak Memperhatikan/Menyadari","UA"],["Sistem Pengaman Tidak Memadai","UC"],["Perkakas/Peralatan Tidak Aman","UC"],["Pemaparan Kondisi Kesehatan","UC"],["Lingkungan Kerja Tidak Aman","UC"],["Ketidakmampuan Fisik","HF"],["Stress Fisik","HF"],["Ketidakmampuan Mental","HF"],["Stress Mental","HF"],["Tingkat Keterampilan","HF"],["Perilaku/Kurang Motivasi","HF"],["Kurang Pelatihan","JF"],["Supervisi Tidak Memadai","JF"],["Seleksi & Pengawasan Kontraktor","JF"],["Rekayasa Desain","JF"],["Rencana Pemeliharaan","JF"],["Pembelian & Kendali Bahan","JF"],["Perkakas/Peralatan Tidak Memadai","JF"],["Peraturan/Prosedur Kerja","JF"],["Komunikasi Tidak Memadai","JF"]];
const GRP = {UA:"Tindakan Tidak Aman", UC:"Kondisi Tidak Aman", HF:"Faktor Manusia", JF:"Faktor Pekerjaan"};
const COMP = ["PT. DIZAMATRA POWERINDO","PT. ANTAREJA MAHADA MAKMUR","PT. SCADA","PT. KALIMANTAN PRIMA PERSADA","PT. SUCOFINDO","SUBCON/VENDOR","PT. CIPTAKRIDATAMA"];
const DEPT = ["PRODUKSI","ANGKUTAN & STASIUN","MAINTENANCE","HR & GA","HEALTH SAFETY & ENVIRONMENT","TECHNICAL SERVICES","CIVIL PROJECT","SUPPLY CHAIN MANAGEMENT"];
const CLS = ["Nearmiss","Property Damage","First Aid","Medical Treatment","Lost Time Injury","Fatality"];
const JNS = ["Menabrak/Ditabrak","Jatuh Pada Permukaan Yang Sama","Tenggelam, Terperosok, Amblas","Terbentur","Proses penanganan(Lifting, Mendorong, Menarik)","Tipe Insiden Lainnya"];
const HRS = [...Array(24)].map((_,i) => `${String(i).padStart(2,"0")}:01 - ${String(i+1).padStart(2,"0")}:00`);
const MON = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

let V = {p:"dash", id:null, co:"", q:"", m:"", rs:"", y:"", st:""}, CH = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cnt = (a,f) => { const m={}; a.forEach(x=>{const k=f(x); if(k) m[k]=(m[k]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
const rp = i => S.rtp.filter(r => r.incId === i);
const idr = n => n.toLocaleString("id-ID");

function go(p, id) {
    V.p = p; 
    if(p == "form") V.ed = null; 
    if(id !== undefined) V.id = id; 
    render(); 
    scrollTo(0,0);
}

function chart(id, type, labels, data, opt={}) {
    const el = document.getElementById(id);
    if(!el || !window.Chart) return;
    CH.push(new Chart(el, {
        type: type,
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: type == "bar" || type == "line" ? "#c2410c" : ["#c2410c","#0e7490","#6d28d9","#ca8a04","#16a34a"],
                borderColor: "#c2410c",
                tension: 0.3
            }]
        },
        options: {
            indexAxis: opt.h ? "y" : "x",
            maintainAspectRatio: false,
            plugins: { legend: { display: type == "doughnut" } }
        }
    }));
}

function cardChart(t, id, h) {
    return `<div class="card"><h3>${t}</h3><div class="cv" style="height:${h||240}px"><canvas id="${id}"></canvas></div></div>`;
}

function dash() {
    const d = F();
    const n = d.length;
    const r = S.rtp.filter(x => d.some(i => i.id == x.incId));
    const dn = r.filter(x => x.status == "Done").length;
    const cost = d.reduce((a,i) => a + (+i.cost || 0), 0);
    const c = k => d.filter(i => i.cls == k).length;
    
    $("#app").innerHTML = `
        <div class="row">${selY()}${selC()}${selS()}</div>
        <div class="kpis">
            <div class="card kpi"><b>${n}</b><span>Total insiden</span></div>
            <div class="card kpi"><b>${c("Nearmiss")}</b><span>Nearmiss</span></div>
            <div class="card kpi"><b>${c("Property Damage")}</b><span>Property Damage</span></div>
            <div class="card kpi"><b>${c("First Aid")}</b><span>First Aid</span></div>
            <div class="card kpi"><b>Rp ${idr(cost)}</b><span>Estimasi biaya</span></div>
            <div class="card kpi"><b>${d.filter(i=>stOf(i)=="Closed").length}/${n}</b><span>Insiden closed</span></div>
            <div class="card kpi"><b>${d.reduce((a,i)=>a+(+i.dlMan||0),0)} / ${d.reduce((a,i)=>a+(+i.dlUnit||0),0)}</b><span>Daylost</span></div>
            <div class="card kpi"><b>${r.length ? Math.round(dn/r.length*100) : 0}%</b><span>RTP selesai</span></div>
        </div>
        <div class="grid">
            ${cardChart("Klasifikasi insiden","c3")}
            ${cardChart("Jenis insiden","c4",280)}
            ${cardChart("Departemen","c7")}
            ${cardChart("Tempat kejadian","c8",280)}
        </div>
    `;
    
    const g = (f, id, t="bar", o) => { const e = cnt(d,f); chart(id, t, e.map(x=>x[0]), e.map(x=>x[1]), o); };
    g(i => i.cls, "c3", "doughnut");
    g(i => i.jns, "c4", "bar", {h:1});
    g(i => i.dept, "c7", "bar", {h:1});
    g(i => i.loc, "c8", "bar", {h:1});
}

function list() {
    const d = F().filter(i => (!V.q || (i.title+i.name+i.ir).toLowerCase().includes(V.q.toLowerCase())) && (!V.m || i.mon == V.m));
    $("#app").innerHTML = `
        <div class="card">
            <div class="row">
                <input placeholder="Cari judul / no. laporan" value="${esc(V.q)}" oninput="V.q=this.value;list2()" style="max-width:300px">
                <select onchange="V.m=this.value;render()">
                    <option value="">Semua bulan</option>
                    ${MON.map(m => `<option ${V.m == m ? "selected" : ""}>${m}</option>`).join("")}
                </select>
                ${selY()}${selC()}${selS()}
            </div>
            <div class="wrap" id="tb"></div>
        </div>
    `;
    list2();
}

function list2() {
    const d = F().filter(i => (!V.q || (i.title+i.name+i.ir).toLowerCase().includes(V.q.toLowerCase())) && (!V.m || i.mon == V.m));
    let html = `<table><tr><th>No. Laporan</th><th>Tanggal</th><th>Judul</th><th>Perusahaan</th><th>Klasifikasi</th><th>RTP</th><th>Status</th></tr>`;
    d.forEach(i => {
        const r = rp(i.id);
        const k = r.filter(x => x.status == "Done").length;
        html += `
            <tr class="cl" onclick="go('detail','${i.id}')">
                <td>${esc(i.ir)}</td>
                <td>${i.date}</td>
                <td>${esc(i.title)}</td>
                <td>${esc(i.co)}</td>
                <td><span class="tag">${esc(i.cls)}</span></td>
                <td>${r.length ? k+"/"+r.length : "-"}</td>
                <td><span class="tag ${stOf(i)}">${stOf(i)}</span></td>
            </tr>
        `;
    });
    html += `</table>`;
    $("#tb").innerHTML = html;
}

function detail() {
    const i = S.inc.find(x => x.id == V.id);
    if (!i) return go("list");
    
    const invStat = i.invStatus || "Belum";
    const invFiles = i.invReport || [];
    
    let html = `<button onclick="go('list')">Kembali</button>`;
    
    html += `
        <div class="card" style="margin-top:10px">
            <h3>${esc(i.ir)}</h3>
            <b style="font-size:16px">${esc(i.title)}</b>
            <div class="f" style="margin-top:10px">
                <div><span class="mu">Tanggal</span><br>${esc(i.date)}</div>
                <div><span class="mu">Lokasi</span><br>${esc(i.loc)}</div>
                <div><span class="mu">Perusahaan</span><br>${esc(i.co)}</div>
                <div><span class="mu">Klasifikasi</span><br>${esc(i.cls)}</div>
            </div>
        </div>
    `;
    
    html += `
        <div class="card">
            <h3>Investigasi Insiden</h3>
            <div class="row ctl">
                <span class="mu">Status: </span>
                <select style="max-width:200px" onchange="up('${i.id}','invStatus',this.value,true)">
                    <option value="Belum" ${invStat == 'Belum' ? 'selected' : ''}>Belum Dilakukan</option>
                    <option value="Sudah" ${invStat == 'Sudah' ? 'selected' : ''}>Sudah Dilakukan</option>
                </select>
                ${invStat == 'Sudah' ? `<label class="btn" style="margin:0">Upload Laporan<input type="file" hidden onchange="upl('${i.id}',this.files,true)"></label>` : ''}
            </div>
            <div class="ev" style="margin-top:8px">
                ${invFiles.map(e => e.t.startsWith("image") ? `<img src="${TH(e.id, 400)}" onclick="lb('${TH(e.id, 1600)}')">` : `<a class="chip" target="_blank" href="https://drive.google.com/file/d/${e.id}/view">Dokumen</a>`).join("")}
            </div>
        </div>
    `;

    html += closeCard(i);
    
    html += `
        <div class="card">
            <h3>Rencana Tindak Lanjut Perbaikan (RTP)</h3>
            ${rp(i.id).map(rtpCard).join("") || '<p class="mu">Belum ada RTP.</p>'}
            <form onsubmit="return addR(event,'${i.id}')" class="f" style="margin-top:10px">
                <div><label>Tindakan perbaikan</label><input name="action" required></div>
                <div><label>PIC</label><input name="pic"></div>
                <div><label>Target selesai</label><input name="due" type="date"></div>
                <div style="align-self:end"><button class="pri">Tambah RTP</button></div>
            </form>
        </div>
    `;
    
    $("#app").innerHTML = html;
}

function rtpCard(r) {
    return `
    <div class="card" style="background:var(--bg)">
        <div class="row" style="justify-content:space-between">
            <b>${esc(r.action)}</b>
            <span class="tag ${r.status}">${r.status}</span>
        </div>
        <div class="mu">PIC: ${esc(r.pic) || "-"} | Target: ${r.due || "-"}</div>
        <div class="bar" style="margin:6px 0"><i style="width:${r.progress}%"></i></div>
        <div class="row ctl">
            <select onchange="up('${r.id}','status',this.value,false)">
                <option value="Open" ${r.status == 'Open' ? 'selected' : ''}>Open</option>
                <option value="Progress" ${r.status == 'Progress' ? 'selected' : ''}>Progress</option>
                <option value="Done" ${r.status == 'Done' ? 'selected' : ''}>Done</option>
            </select>
            <input type="range" min="0" max="100" step="5" value="${r.progress}" style="width:140px" onchange="up('${r.id}','progress',+this.value,false)">
            <span>${r.progress}%</span>
            <label class="btn" style="margin:0">Upload Bukti<input type="file" hidden onchange="upl('${r.id}',this.files,false)"></label>
        </div>
        <div class="ev">
            ${r.ev.map(e => e.t.startsWith("image") ? `<img src="${TH(e.id, 400)}" onclick="lb('${TH(e.id, 1600)}')">` : `<a class="chip" target="_blank" href="https://drive.google.com/file/d/${e.id}/view">Dokumen</a>`).join("")}
        </div>
    </div>`;
}

function closeCard(i) {
    if (stOf(i) == "Closed") {
        return `
            <div class="card">
                <h3>Status insiden</h3>
                <span class="tag Closed">CLOSED</span>
                <p>Oleh: ${esc(i.closeBy)}</p>
                <button onclick="reopen('${i.id}')">Buka kembali (reopen)</button>
            </div>
        `;
    } else {
        return `
            <div class="card">
                <h3>Status insiden</h3>
                <span class="tag Open">OPEN</span>
                <form onsubmit="return closeInc(event,'${i.id}')" class="f" style="margin-top:8px">
                    <div><label>Tanggal closing</label><input type="date" name="d" required></div>
                    <div><label>Ditutup oleh</label><input name="by" required></div>
                    <div style="grid-column:1/-1"><label>Catatan penutupan</label><textarea name="n" rows="2"></textarea></div>
                    <div><button class="pri">Closing insiden</button></div>
                </form>
            </div>
        `;
    }
}

function up(id, k, v, isInc) {
    if(isInc) {
        const i = S.inc.find(x => x.id == id); 
        i[k] = v;
    } else {
        const r = S.rtp.find(x => x.id == id); 
        r[k] = v;
        if(k == "status" && v == "Done") r.progress = 100;
        r.log.push(`Update: ${v}`);
    }
    save(); 
    render();
}

function addR(e, id) {
    e.preventDefault();
    const o = {id:"r"+Date.now(), incId:id, status:"Open", progress:0, ev:[], log:[]};
    new FormData(e.target).forEach((v,k) => o[k] = v);
    S.rtp.push(o);
    save();
    render();
    return false;
}

function closeInc(e, id) {
    e.preventDefault();
    const i = S.inc.find(x => x.id == id);
    const f = new FormData(e.target);
    Object.assign(i, {status:"Closed", closeDate:f.get("d"), closeBy:f.get("by"), closeNote:f.get("n")});
    save();
    render();
    return false;
}

function reopen(id) {
    if(!confirm("Buka kembali insiden ini?")) return;
    const i = S.inc.find(x => x.id == id);
    Object.assign(i, {status:"Open", closeDate:"", closeBy:"", closeNote:""});
    save();
    render();
}

function lb(s) { $("#lbi").src = s; $("#lb").style.display = "flex"; }
function form() { $("#app").innerHTML = `<div class="card">Fitur form ada di versi lengkap</div>`; }
function rca() { $("#app").innerHTML = `<div class="card">Fitur RCA ada di versi lengkap</div>`; }
function rtpAll() { $("#app").innerHTML = `<div class="card">Fitur Rekap RTP ada di versi lengkap</div>`; }

let S = {inc:[], rtp:[]}, ME = null, TOKEN = sessionStorage.getItem("tk") || "", SNAP = {};
const TH = (id,w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;

async function api(action, data) {
    let r;
    try {
        const response = await fetch(API_URL, { method:"POST", body:JSON.stringify({action, token:TOKEN, data}) });
        r = JSON.parse(await response.text());
    } catch(e) {
        throw new Error("Tidak bisa terhubung ke server Google Apps Script.");
    }
    if(!r.ok) { throw new Error(r.error); }
    ME = r.user; 
    return r.data;
}

const snap = () => { SNAP={}; [...S.inc,...S.rtp].forEach(x => SNAP[x.id] = JSON.stringify(x)); };

function upl(id, fs, isInv) {
    const obj = isInv ? S.inc.find(x=>x.id==id) : S.rtp.find(x=>x.id==id);
    if(isInv && !obj.invReport) obj.invReport = [];
    const evArr = isInv ? obj.invReport : obj.ev;
    
    Array.from(fs).forEach(f => {
        const rd = new FileReader();
        rd.onload = () => {
            const b64 = rd.result.split(",")[1];
            api("upload", {incId: isInv ? obj.id : obj.incId, rtpId: isInv ? null : obj.id, name: f.name, type: f.type, b64: b64})
            .then(x => { evArr.push(x); save(); render(); })
            .catch(e => alert("Gagal upload: " + e.message));
        };
        rd.readAsDataURL(f);
    });
}

let Q = Promise.resolve(), T;
function st(m) { const e=$("#st"); e.textContent=m; e.style.display=m?"block":"none"; }
function save() { clearTimeout(T); st("Menyimpan..."); T=setTimeout(flush, 700); }

function flush() {
    const jobs = [];
    S.inc.forEach(i => { const j=JSON.stringify(i); if(SNAP[i.id]!=j) jobs.push(["saveInc",i,i.id,j]); });
    S.rtp.forEach(r => { const j=JSON.stringify(r); if(SNAP[r.id]!=j) jobs.push(["saveRtp",r,r.id,j]); });
    
    if(!jobs.length) return st("");
    
    jobs.reduce((p, [a,d,id,j]) => p.then(() => api(a,d).then(() => { SNAP[id] = j; })), Promise.resolve())
    .then(() => { st("Tersimpan ✓"); setTimeout(()=>st(""), 1500); })
    .catch(e => { alert("Gagal menyimpan data."); st("Gagal menyimpan."); });
}

const yr = i => String(i.date || "").slice(0,4);
const stOf = i => i.status || "Open";
const years = () => [...new Set(S.inc.map(yr).filter(Boolean))].sort().reverse();
const F = () => S.inc.filter(i => (!V.y || yr(i) == V.y) && (!V.co || i.co == V.co) && (!V.st || stOf(i) == V.st));
const sel = (k, all, o) => `<select onchange="V.${k}=this.value;render()"><option value="">${all}</option>${o.map(([v,l]) => `<option value="${esc(v)}" ${V[k]==v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
const selY = () => sel("y", "Semua tahun", years().map(y=>[y,y]));
const selC = () => sel("co", "Semua perusahaan", COMP.map(c=>[c,c]));
const selS = () => sel("st", "Semua status", [["Open","Open"],["Closed","Closed"]]);

function login() {
    nav();
    $("#app").innerHTML = `<div class="card" style="text-align:center"><h3>Masuk</h3><div id="g" style="display:inline-block"></div></div>`;
    google.accounts.id.initialize({client_id:CLIENT_ID, callback:r=>{TOKEN=r.credential; sessionStorage.setItem("tk",TOKEN); start();}});
    google.accounts.id.renderButton($("#g"), {theme:"outline", size:"large"});
}

async function start() {
    $("#app").innerHTML = '<p class="mu">Memuat data dari Google Sheets...</p>';
    try {
        S = await api("getAll");
        snap();
        if(!V.y) V.y = years()[0] || "";
        render();
    } catch(e) {
        $("#app").innerHTML = `<div class="card" style="color:red">Gagal memuat data: ${e.message}</div>`;
    }
}

function nav() {
    if(!ME) return;
    const t = [["dash","Dashboard"], ["list","Daftar Insiden"], ["form","+ Input Resume"], ["rca","Root Cause"], ["rtp","RTP & Bukti"]];
    $("#nav").innerHTML = t.map(([k,l]) => `<button class="${V.p==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
}

function render() {
    CH.forEach(c => c.destroy()); CH = [];
    nav();
    if(V.p == "dash") dash();
    else if(V.p == "list") list();
    else if(V.p == "detail") detail();
    else if(V.p == "form") form();
    else if(V.p == "rca") rca();
    else if(V.p == "rtp") rtpAll();
}

window.onload = () => OPEN_ACCESS || TOKEN ? start() : login();
</script>
</body>
</html>
