.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.row>*{width:auto}

.inv0{color:var(--mu)}.inv1{color:var(--wa)}.inv2{color:var(--ok)}
</style>

function chart(id,type,labels,data,opt={}){const el=document.getElementById(id);if(!el||!window.Chart)return;theme();

{const ys=[...new Set(d.map(yr))].sort(),pal=["#c2410c","#0e7490","#6d28d9","#ca8a04","#16a34a"];

let Q=Promise.resolve(),T;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enq=fn=>{const p=Q.then(async()=>{for(let k=0;;k++){try{return await fn()}catch(e){if(!e.net||k>=2)throw e;await sleep(1500*(k+1))}}});Q=p.catch(()=>{});return p};

function flush(){const jobs=[];

S.rtp.forEach(r=>{const j=JSON.stringify(r);if(SNAP[r.id]!=j)jobs.push(["saveRtp",r,r.id,j])});
const ids=new Set([...S.inc,...S.rtp].map(x=>x.id));Object.keys(SNAP).filter(k=>!ids.has(k)&&k[0]=="r").forEach(k=>jobs.push(["delRtp",{id:k},k,null]));
if(!jobs.length)return st("");st("Menyimpan…");
jobs.reduce((p,[a,d,id,j])=>p.then(()=>enq(()=>api(a,d)).then(()=>{j===null?delete SNAP[id]:SNAP[id]=j})),Promise.resolve())
.then(()=>{st("Tersimpan ✓");setTimeout(()=>{if($("#st").textContent=="Tersimpan ✓")st("")},1500)}).catch(e=>st("Gagal menyimpan: "+e.message+" — klik di sini untuk coba lagi",1))}
